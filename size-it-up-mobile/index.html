<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6ecd4">
<title>比大小 · 估测游戏中心</title>
<style>
/* ============================================================
   《比大小》暖色手绘休闲风 UI（GDD 8.1）
   奶油纸张底色 · 柔和木质边框 · 绿色卷轴标题 · 圆角按钮 · 植物装饰
   颜色仅作辅助，不作为唯一状态标识。
   ============================================================ */
:root {
  --paper: #fdf8ec;        /* 米色纸张卡片 */
  --paper-deep: #f6ecd4;   /* 页面底 */
  --wood: #c8945f;         /* 木质边框 */
  --wood-dark: #a9744a;
  --wood-line: #8a5c36;
  --ink: #4a3728;          /* 深棕文字 */
  --sub: #7a6647;          /* 次级文字（加深至 AA：纸底 5.2:1 / 页面底 4.7:1） */
  --scroll-a: #8dc63f;     /* 绿卷轴 */
  --scroll-b: #66a02c;
  --scroll-text: #44701a;  /* 绿色文字专用（对纸底/页面底均 ≥4.5:1），卷轴底色仍用 --scroll-b */
  --green-text: #3d8a4c;   /* 大字绿色（得分等，对纸底 ≥3:1） */
  --red-text: #c0392b;     /* 红色文字（扣血等，对纸底 ≥4.5:1） */
  --blue: #4fa3e3;         /* 视觉模式强调 */
  --blue-soft: #e6f2fb;
  --red: #ef6a5a;
  --red-soft: #fdeae6;
  --green: #58b368;
  --purple: #a06fd0;       /* 数量级强调 */
  --purple-soft: #f3ecfb;
  --orange: #f5a623;       /* 生存强调 */
  --orange-soft: #fdf1de;
  --orange-deep: #f0a02f;  /* 深橙：中途进度点/计时告警（与 --orange 成对使用的双橙统一收口） */
  --line: #ecdfc4;
  --warn: #9a5a10;         /* 琥珀告警文字：对纸底 4.7:1 / 橙浅底 5.2:1，均达 AA */
  --brown-ink: #7c5a1e;    /* 提示框/冷知识注释文字：对浅黄底 ≥4.5:1 */
  --focus: #1d6fa5;        /* 键盘焦点环：对纸底 5.1:1（≥3:1） */
  --paper-flat: #f1ece0;   /* 中性浅纸：清零按钮等 */

  /* 字阶（原 15 档临界值就近并档：10→11、15→14、17→16、19→18、28/24→26） */
  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-18: 18px;
  --fs-22: 22px;
  --fs-26: 26px;
  --fs-50: 50px;

  /* 圆角（原 2/4/5/6→sm、10/14→md、15/16/18→lg、22/24/26→xl；50% 圆点保留） */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 24px;

  /* 间距音阶（4 的倍数；散距就近并档，视觉差异 ≤2px） */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-7: 28px;
  --sp-8: 32px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
@media (pointer: fine) { html { overscroll-behavior: none; } }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  color: var(--ink);
  touch-action: manipulation;
  display: flex;
  justify-content: center;
  /* 刘海屏安全区补偿（配合 viewport-fit=cover） */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.55), transparent 45%),
    radial-gradient(circle at 80% 30%, rgba(214,189,139,.30), transparent 40%),
    radial-gradient(circle at 30% 85%, rgba(196,167,113,.25), transparent 45%),
    var(--paper-deep);
  background-attachment: fixed;
}
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding: var(--sp-3) var(--sp-3) var(--sp-7);
}
.hidden { display: none !important; }

/* 木质卡片：外框木色 + 内衬纸色 */
.stage, .q-card, .reveal, .mode-card, .modal-card, .screen-end > .card {
  background: var(--paper);
  border: 3px solid var(--wood);
  border-radius: var(--r-lg);
  box-shadow: 0 3px 0 var(--wood-line), 0 8px 18px rgba(120, 84, 45, .16);
  position: relative;
}

/* ===== 头部：绿色卷轴标题 ===== */
header { text-align: center; padding: var(--sp-2) 0 var(--sp-1); position: relative; }
header h1 {
  display: inline-block;
  font-size: var(--fs-22);
  letter-spacing: 2px;
  color: #fff;
  padding: var(--sp-2) var(--sp-7);
  background: linear-gradient(180deg, var(--scroll-a), var(--scroll-b));
  border: 3px solid #55891f;
  border-radius: var(--r-md);
  box-shadow: 0 3px 0 #4d7d1d, inset 0 1px 0 rgba(255,255,255,.45);
  text-shadow: 0 1px 2px rgba(40, 70, 10, .45);
  position: relative;
}
header h1::before, header h1::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 26px; height: 14px;
  background: linear-gradient(180deg, #7ab52f, #5e9524);
  border: 3px solid #55891f;
  border-radius: var(--r-sm);
  transform: translateY(-50%);
}
header h1::before { left: -24px; border-right: none; border-radius: var(--r-sm) 0 0 var(--r-sm); }
header h1::after { right: -24px; border-left: none; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
header p { font-size: var(--fs-12); color: var(--sub); margin-top: var(--sp-2); }
#settings-btn {
  position: absolute; top: 8px; right: 0;
  background: var(--paper); border: 2px solid var(--wood);
  border-radius: 50%; width: 34px; height: 34px;
  font-size: var(--fs-16); cursor: pointer; box-shadow: 0 2px 0 var(--wood-line);
}
/* 视觉保持 34px 圆钮，伪元素把触控命中区扩到 44×44 */
#settings-btn::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%); width: 44px; height: 44px;
}
#settings-btn:active { transform: translateY(2px); box-shadow: none; }

/* ===== 按钮：圆角立体 ===== */
.btn {
  display: block;
  width: 100%;
  padding: var(--sp-3) var(--sp-4);
  border: none;
  border-radius: var(--r-xl);
  font-size: var(--fs-16);
  font-weight: 700;
  color: #fff;
  background: linear-gradient(180deg, #62b1f0, var(--blue));
  box-shadow: 0 4px 0 #2f7cbd, inset 0 1px 0 rgba(255,255,255,.4);
  cursor: pointer;
  transition: transform .1s, box-shadow .1s;
  font-family: inherit;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2f7cbd, inset 0 1px 0 rgba(255,255,255,.4); }
.btn.green { background: linear-gradient(180deg, #8ed056, var(--green)); box-shadow: 0 4px 0 #3d8a4c, inset 0 1px 0 rgba(255,255,255,.4); }
.btn.green:active { box-shadow: 0 1px 0 #3d8a4c; }
.btn.lock { background: linear-gradient(180deg, #ff8b7a, var(--red)); box-shadow: 0 4px 0 #c14637, inset 0 1px 0 rgba(255,255,255,.4); }
.btn.lock:active { box-shadow: 0 1px 0 #c14637; }
.btn.sub { background: linear-gradient(180deg, #f4ead4, #e9dcc0); color: var(--ink); font-size: var(--fs-14); padding: var(--sp-3); box-shadow: 0 3px 0 #cbb990; }
.btn.sub:active { box-shadow: 0 1px 0 #cbb990; }
/* 与上方内容留一档间距（原三处内联 margin-top:14px 收口成类） */
.btn.gap-top { margin-top: var(--sp-3); }
.btn + .btn { margin-top: var(--sp-2); }
.link-btn {
  background: none; border: none; color: var(--scroll-text);
  font-size: var(--fs-13); font-weight: 700; cursor: pointer; padding: var(--sp-1) var(--sp-2);
  font-family: inherit; text-decoration: underline; position: relative;
}
.mini-btn {
  background: var(--paper); border: 2px solid var(--wood);
  color: var(--sub); font-size: var(--fs-12); border-radius: var(--r-md);
  padding: var(--sp-2) var(--sp-3); cursor: pointer; font-family: inherit;
  box-shadow: 0 2px 0 var(--wood-line); position: relative;
}
.mini-btn:active { transform: translateY(2px); box-shadow: none; }
/* 视觉尺寸不变，伪元素把触控命中区补到 40px 高 */
.link-btn::after, .mini-btn::after {
  content: ''; position: absolute; left: 0; right: 0; top: 50%;
  transform: translateY(-50%); height: 40px;
}

@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ===== 主页 ===== */
.streak-row {
  margin-top: var(--sp-3); text-align: center; font-size: var(--fs-13); font-weight: 700;
  color: var(--warn); background: var(--orange-soft);
  border: 2px dashed var(--orange); border-radius: var(--r-md); padding: var(--sp-2);
}
.modes { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-3); }
.mode-card {
  width: 100%;
  font-family: inherit; font-size: inherit; color: inherit; text-align: left;
  padding: var(--sp-3) var(--sp-4);
  display: flex; align-items: center; gap: var(--sp-3);
  cursor: pointer;
  transition: transform .1s;
}
.mode-card:active { transform: scale(.98); }
.mode-card .ic {
  width: 52px; height: 52px; border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-26); flex: none;
  background: #fff;
  border: 2px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
}
.mode-card .tx { flex: 1; min-width: 0; }
.mode-card .tx .ttl { display: block; font-size: var(--fs-16); font-weight: 700; }
.mode-card .tx .desc { display: block; font-size: var(--fs-12); color: var(--sub); margin-top: 2px; }
.mode-card .best {
  font-size: var(--fs-11); color: var(--sub); background: #f4ecd9;
  border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-1) var(--sp-2);
  flex: none; white-space: nowrap;
}
.mode-card .howto {
  font-size: var(--fs-11); color: var(--scroll-text); background: #f2f8e6;
  border: 1px solid #d7e8b8; border-radius: var(--r-sm); padding: var(--sp-1) var(--sp-2);
  margin-left: var(--sp-1); white-space: nowrap;
}
.tag { font-size: var(--fs-11); font-weight: 700; padding: 2px var(--sp-2); border-radius: var(--r-sm); margin-left: var(--sp-1); vertical-align: 2px; }
.tag.daily { background: var(--purple-soft); color: var(--purple); }
.tag.practice { background: #eaf6ec; color: var(--green); }
/* 首屏骨架：题库加载完成后由 renderHome 的 innerHTML='' 自然替换 */
.mode-card.skel { cursor: default; pointer-events: none; }
.mode-card.skel .skel-ic {
  width: 52px; height: 52px; border-radius: var(--r-md);
  background: #efe6d0; flex: none;
}
.mode-card.skel .skel-tx { flex: 1; display: flex; flex-direction: column; gap: var(--sp-1); }
.mode-card.skel .skel-tx i { display: block; height: 12px; border-radius: var(--r-sm); background: #efe6d0; }
.mode-card.skel .skel-tx i:first-child { width: 42%; }
.mode-card.skel .skel-tx i:last-child { width: 74%; }
.skel-note { text-align: center; font-size: var(--fs-12); color: var(--sub); }
.mode-card.skel .skel-ic, .mode-card.skel .skel-tx i { animation: skelPulse 1.2s ease-in-out infinite; }
@keyframes skelPulse { 50% { opacity: .5; } }
.pack-info { text-align: center; font-size: var(--fs-11); color: var(--sub); margin-top: var(--sp-4); }
/* 告警文案与常规信息分层（校验问题 / 存储禁用） */
.pack-info .warn, .modal-note .warn { color: var(--warn); font-weight: 700; }
.home-actions { display: flex; justify-content: center; gap: var(--sp-2); margin-top: var(--sp-1); }

/* ===== 视觉模式 ===== */
.hud {
  display: flex; justify-content: space-between; align-items: center;
  margin: var(--sp-3) 0; font-size: var(--fs-13); color: var(--sub); font-weight: 700;
}
.dots { display: flex; gap: var(--sp-1); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #e3d7bd; transition: background-color .3s, border-color .3s, transform .3s; border: 1px solid #d2c1a0; }
.dot.on { background: var(--blue); transform: scale(1.2); }
.dot.done-90 { background: var(--green); }
.dot.done-mid { background: var(--orange-deep); }
.dot.done-bad { background: var(--red); }

.stage { padding: var(--sp-3) var(--sp-3) var(--sp-2); }
.arena {
  height: 300px; display: flex; justify-content: center;
  align-items: flex-end; gap: var(--sp-8); overflow: hidden; position: relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,.55), rgba(250,243,226,.2));
  border-radius: var(--r-md);
  border: 1px dashed var(--line);
}
.arena::after {
  content: ''; position: absolute; left: 8px; right: 8px; bottom: 30px;
  border-bottom: 2px dashed #e0d2b4;
}
.obj { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; z-index: 1; }
.obj .emoji { line-height: 1; user-select: none; -webkit-user-select: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,.12)); touch-action: none; }
.obj .emoji img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
.obj .bar { width: 3px; margin-top: var(--sp-1); opacity: .3; border-radius: 2px; }
.obj.ref .bar { background: var(--blue); }
.obj.tgt .bar { background: var(--red); }
.obj.tgt .emoji { cursor: ns-resize; }
.obj.tgt.dragging .emoji { filter: drop-shadow(0 6px 12px rgba(0,0,0,.2)); }
.stage-scale {
  text-align: center; font-size: var(--fs-12); color: var(--warn);
  background: var(--orange-soft); border: 1px dashed var(--orange);
  border-radius: var(--r-md); padding: var(--sp-1); margin-top: var(--sp-2);
}
.labels { display: flex; justify-content: center; gap: var(--sp-8); margin-top: var(--sp-2); }
.label {
  min-width: 110px; max-width: 46%; text-align: center; font-size: var(--fs-13); font-weight: 700;
  padding: var(--sp-2); border-radius: var(--r-md);
}
.label small { display: block; font-weight: 400; font-size: var(--fs-11); color: var(--sub); margin-top: 1px; }
.label.ref { background: var(--blue-soft); color: #2f7cbd; border: 1px solid #cfe6f7; }
.label.tgt { background: var(--red-soft); color: #d1503f; border: 1px solid #f8d3cb; }

.controls { margin-top: var(--sp-4); }
input[type="range"] { width: 100%; height: 44px; -webkit-appearance: none; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track {
  height: 12px; border-radius: var(--r-sm);
  background: linear-gradient(90deg, #efe4cc, #dccca8);
  border: 1px solid #d2bf98;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff9a8a, var(--red));
  border: 4px solid #fff;
  box-shadow: 0 2px 6px rgba(180, 80, 60, .45); margin-top: -11px; cursor: pointer;
}
input[type="range"]::-moz-range-track { height: 12px; border-radius: var(--r-sm); background: #dccca8; }
input[type="range"]::-moz-range-thumb {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--red); border: 4px solid #fff;
  box-shadow: 0 2px 6px rgba(180, 80, 60, .45);
}
input[type="range"]:disabled { opacity: .5; }

.tick-wrap { position: relative; height: 16px; margin-top: 2px; }
/* 刻度标签：10→11px 并加深颜色（wood-line 对页面底 4.9:1，11px 小字达 AA） */
.tick { position: absolute; transform: translateX(-50%); font-size: var(--fs-11); color: var(--wood-line); font-weight: 600; }
.tick::before { content: ''; position: absolute; left: 50%; top: -6px; width: 1px; height: 4px; background: #d6c5a1; }
/* 首尾标签贴边不出界：首位不平移，末位整体左移 */
.tick:first-child { transform: none; }
.tick:last-child { transform: translateX(-100%); }
/* 窄屏（≤420px，覆盖主流手机）隔位隐藏刻度文字：13 个标签在 ~300px 滑轨上必然
   相邻重叠（最左端 10⁻⁶/10⁻⁵ 最先相撞）；font-size:0 只藏文字、保留刻度线 */
@media (max-width: 420px) {
  .tick:nth-child(even) { font-size: 0; }
}
/* 极窄屏（≤340px）只保留首尾刻度文字 */
@media (max-width: 340px) {
  .tick:not(:first-child):not(:last-child) { font-size: 0; }
}

.fine-row { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-1); }
.fine-btn {
  flex: none; padding: var(--sp-3); border-radius: var(--r-lg);
  border: 2px solid var(--wood); background: var(--paper);
  color: var(--ink); font-weight: 800; font-size: var(--fs-13); cursor: pointer;
  box-shadow: 0 3px 0 var(--wood-line); font-family: inherit; white-space: nowrap;
}
.fine-btn:active { transform: translateY(3px); box-shadow: none; }
.fine-btn:disabled { opacity: .5; }
.fine-tip { flex: 1; text-align: center; font-size: var(--fs-11); color: var(--sub); line-height: 1.5; }

/* 揭晓区：pop 淡入（与 hint 一致；reduced-motion 机制下自动降为瞬时） */
.reveal { margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4); text-align: center; animation: pop .35s ease; }
.reveal .verdict { font-size: var(--fs-16); font-weight: 800; }
.reveal .detail { font-size: var(--fs-13); color: var(--sub); margin-top: var(--sp-1); line-height: 1.75; }
.reveal .detail b { color: var(--ink); }
.reveal .note {
  font-size: var(--fs-12); color: var(--brown-ink); background: #fbf3df;
  border: 1px dashed #e2cf9f; border-radius: var(--r-md);
  padding: var(--sp-2); margin-top: var(--sp-2); line-height: 1.7; text-align: left;
}
.reveal .score-line { font-size: var(--fs-26); font-weight: 800; margin-top: var(--sp-1); }
.reveal .score-line b { color: var(--green-text); }
.reveal .btn { margin-top: var(--sp-3); }
.reveal-actions { display: flex; justify-content: center; margin-top: var(--sp-2); }

/* ===== 数值模式 ===== */
.q-card { padding: var(--sp-4); margin-top: var(--sp-1); }
.q-card .q-tag { font-size: var(--fs-11); color: var(--purple); font-weight: 800; letter-spacing: 1px; }
.q-card .q-text { font-size: var(--fs-18); font-weight: 800; line-height: 1.55; margin-top: var(--sp-2); }
.q-card .q-hint { font-size: var(--fs-12); color: var(--sub); margin-top: var(--sp-2); line-height: 1.7; }
.tip-box {
  font-size: var(--fs-13); line-height: 1.75; color: var(--brown-ink);
  background: var(--orange-soft); border: 1px dashed var(--orange);
  border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); margin-top: var(--sp-2);
}
.num-input-row {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--paper); border: 3px solid var(--wood);
  border-radius: var(--r-lg); padding: var(--sp-3); margin-top: var(--sp-3);
  box-shadow: 0 3px 0 var(--wood-line);
}
.num-input-row:focus-within { border-color: var(--purple); }
.num-input-row input {
  flex: 1; border: none; outline: none; font-size: var(--fs-22); font-weight: 800;
  font-family: inherit; color: var(--ink); min-width: 0; background: transparent;
}
.num-input-row .unit { font-size: var(--fs-13); color: var(--sub); flex: none; }
.norm-hint { font-size: var(--fs-12); color: var(--purple); text-align: center; margin-top: var(--sp-2); font-weight: 700; }
.chips { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); flex-wrap: wrap; }
.chip {
  flex: 1; min-width: 60px; padding: var(--sp-2) var(--sp-1); border: none; border-radius: var(--r-md);
  background: var(--purple-soft); color: var(--purple); font-weight: 800; font-size: var(--fs-13);
  cursor: pointer; font-family: inherit;
  box-shadow: 0 3px 0 #d9c8f0;
}
.chip:active { transform: translateY(3px); box-shadow: none; }
.chip:disabled { opacity: .5; }
.draft-toggle {
  display: block; margin: var(--sp-3) auto 0; background: none; border: none;
  color: var(--purple); font-size: var(--fs-13); font-weight: 800; cursor: pointer;
  padding: var(--sp-1) var(--sp-3); font-family: inherit;
}
.draft-area {
  width: 100%; min-height: 90px; margin-top: var(--sp-2);
  border: 2px dashed var(--purple); border-radius: var(--r-md);
  padding: var(--sp-2); font-size: var(--fs-14); font-family: inherit;
  resize: vertical; outline: none; background: #fdfbff; color: var(--ink);
}

/* 生存模式 */
.life-bar { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-3) 0 var(--sp-1); font-size: var(--fs-14); font-weight: 800; }
.life-hearts { color: var(--red); letter-spacing: 2px; font-size: var(--fs-13); }
.timer-track { height: 10px; background: #e9dcc0; border-radius: var(--r-sm); overflow: hidden; margin-top: var(--sp-2); border: 1px solid #dccca8; }
/* 计时条改用 transform 缩放，避免 width 动画触发布局 */
.timer-fill { height: 100%; width: 100%; background: var(--green); border-radius: var(--r-sm); transform-origin: left center; transition: transform .12s linear; }
.surv-count { font-size: var(--fs-12); color: var(--sub); margin-top: var(--sp-2); }

/* ===== 结算 ===== */
.screen-end { text-align: center; animation: pop .4s ease; margin-top: var(--sp-3); }
.screen-end .big { font-size: var(--fs-50); font-weight: 900; margin: var(--sp-2) 0 var(--sp-1); }
.screen-end .big small { font-size: var(--fs-18); color: var(--sub); font-weight: 600; }
.screen-end .comment { font-size: var(--fs-14); color: var(--sub); margin: var(--sp-2) 0 var(--sp-4); line-height: 1.6; }
.squares { display: flex; justify-content: center; gap: var(--sp-2); font-size: var(--fs-26); margin: var(--sp-2) 0 var(--sp-4); }
.roundlist { text-align: left; font-size: var(--fs-13); color: var(--sub); margin: 0 0 var(--sp-4); line-height: 2; list-style: none; }
.roundlist b { color: var(--ink); }
.back-row { margin-top: var(--sp-4); text-align: center; }
.back-row button { background: none; border: none; color: var(--sub); font-size: var(--fs-13); text-decoration: underline; cursor: pointer; padding: var(--sp-2); font-family: inherit; }

/* ===== 提示条 / toast ===== */
.hint-bar {
  background: var(--blue-soft); color: #2f7cbd;
  font-size: var(--fs-13); font-weight: 600; line-height: 1.5;
  border-radius: var(--r-md); padding: var(--sp-2) var(--sp-4); margin: var(--sp-3) 0 0;
  border: 1px solid #cfe6f7;
  animation: pop .3s ease;
}
#screen-numeric .hint-bar { background: var(--purple-soft); color: var(--purple); border-color: #e0d0f5; }
.toast {
  position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
  background: rgba(74, 55, 40, .94); color: #fff; font-size: var(--fs-14); font-weight: 600;
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-xl); z-index: 200; max-width: 84%;
  text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.ach-toast {
  position: fixed; left: 50%; top: 8%; transform: translateX(-50%);
  background: linear-gradient(180deg, #ffe9a8, #ffd766);
  color: #7a5100; font-size: var(--fs-14); font-weight: 800;
  padding: var(--sp-3) var(--sp-5); border-radius: var(--r-xl); z-index: 210;
  border: 3px solid #e9a92c; box-shadow: 0 6px 16px rgba(190, 130, 20, .35);
  animation: achIn .5s cubic-bezier(.2,1.4,.4,1);
}
@keyframes achIn { from { transform: translate(-50%, -30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* ===== 弹层 ===== */
.modal {
  position: fixed; inset: 0; background: rgba(60, 42, 24, .45);
  display: flex; align-items: center; justify-content: center; z-index: 150;
  padding: 20px;
}
.modal-card {
  width: 100%; max-width: 400px; max-height: 84vh; overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--sp-4) var(--sp-4) var(--sp-5); animation: pop .25s ease;
}
.modal-title { font-size: var(--fs-16); font-weight: 800; text-align: center; margin-bottom: var(--sp-3); }
.modal-note { font-size: var(--fs-12); color: var(--sub); margin-top: var(--sp-3); line-height: 1.6; }
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-3) var(--sp-1); font-size: var(--fs-14); font-weight: 700;
  border-bottom: 1px dashed var(--line);
}
.setting-row label { cursor: pointer; }
.toggle {
  width: 52px; height: 30px; border-radius: var(--r-lg); border: none;
  background: #ddd0b4; position: relative; cursor: pointer; transition: background .2s;
}
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 24px; height: 24px; border-radius: 50%; background: #fff;
  transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.toggle[aria-checked="true"] { background: var(--green); }
.toggle[aria-checked="true"]::after { transform: translateX(22px); }
.info-list { font-size: var(--fs-14); line-height: 1.9; color: var(--ink); text-align: left; }
.info-list li { margin-left: var(--sp-4); }
.info-list h4 { margin: var(--sp-3) 0 var(--sp-1); color: var(--scroll-text); }
.ach-list { list-style: none; }
.ach-item {
  display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-2) var(--sp-1);
  border-bottom: 1px dashed var(--line);
}
.ach-item .badge { font-size: var(--fs-26); flex: none; width: 38px; text-align: center; filter: grayscale(1); opacity: .45; }
.ach-item.got .badge { filter: none; opacity: 1; }
.ach-item .meta { flex: 1; text-align: left; }
.ach-item .meta b { font-size: var(--fs-14); }
.ach-item .meta p { font-size: var(--fs-12); color: var(--sub); }
.ach-item .date { font-size: var(--fs-11); color: var(--sub); flex: none; }

/* ===== 分步引导 ===== */
.guide-layer { position: fixed; inset: 0; z-index: 180; }
.guide-spot {
  position: absolute; left: 0; top: 0; border-radius: var(--r-lg);
  box-shadow: 0 0 0 9999px rgba(50, 35, 18, .62), 0 0 0 4px #ffd766;
  /* 位置改用 transform 移动（合成层动画），尺寸直设不做过场 */
  transition: transform .3s ease; pointer-events: none;
}
.guide-bubble {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: 7%; width: min(88%, 380px);
  background: var(--paper); border: 3px solid var(--wood);
  border-radius: var(--r-lg); padding: var(--sp-4); pointer-events: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
}
.guide-text { font-size: var(--fs-14); line-height: 1.7; font-weight: 600; }
.guide-ops { display: flex; justify-content: space-between; align-items: center; margin-top: var(--sp-3); }
.guide-next {
  width: auto; padding: var(--sp-2) var(--sp-7); font-size: var(--fs-14);
  background: linear-gradient(180deg, #8ed056, var(--green));
  box-shadow: 0 4px 0 #3d8a4c;
}
.guide-next:active { box-shadow: 0 1px 0 #3d8a4c; }

/* ===== 无障碍 / 动态效果 ===== */
/* 数字等宽：分数 / 结算 / 计数跳动时不抖动列宽 */
.score-line, .score-line b, .surv-count, .hud span, .screen-end .big, .roundlist {
  font-variant-numeric: tabular-nums;
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  animation-duration: .01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: .01ms !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
  /* 三态开关「强制开启」：body.motion-forced 覆盖系统 reduce 规则，让动效真实播放 */
  body.motion-forced *, body.motion-forced *::before, body.motion-forced *::after {
    animation-duration: .35s !important;
    transition-duration: .18s !important;
  }
}
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}

/* ===== 无障碍辅助 ===== */
/* 仅供读屏的文字（各屏 h2 标题等） */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip: rect(0 0 0 0); clip-path: inset(50%); overflow: hidden; white-space: nowrap;
}
/* 跳到主内容：聚焦时才显示 */
.skip-link {
  position: absolute; left: var(--sp-2); top: -60px; z-index: 300;
  background: var(--ink); color: #fff; font-size: var(--fs-14); font-weight: 700;
  padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); text-decoration: none;
  transition: top .15s ease;
}
.skip-link:focus { top: var(--sp-2); }
/* 输入解析失败的内联错误（常驻渲染保证 aria-live 首次可播报，空时零高度） */
.input-error {
  font-size: var(--fs-12); font-weight: 700; color: var(--red-text);
}
.input-error:not(:empty) { margin-top: var(--sp-2); }

/* 悬停态（仅指针设备；触屏不受影响，:active 逻辑保持不变） */
@media (hover: hover) {
  .btn:hover { filter: brightness(1.07); }
  .link-btn:hover { color: #35601a; }
  .mini-btn:hover, .fine-btn:hover { filter: brightness(.97); }
  .mode-card:hover { box-shadow: 0 3px 0 var(--wood-line), 0 10px 22px rgba(120, 84, 45, .24); }
  #settings-btn:hover, .draft-toggle:hover { filter: brightness(.94); }
  .chip:hover { filter: brightness(.97); }
  .toggle:hover { filter: brightness(.96); }
  .back-row button:hover { color: var(--ink); }
}

/* 桌面端居中呈现 */
@media (min-width: 520px) {
  .app { padding-top: 20px; }
}

       <b>\u6BCF\u65E5\u4E00\u9898</b>\uFF1A\u6309\u56FA\u5B9A\u6392\u671F\u51FA\u9898\uFF0C\u540C\u5929\u91CD\u590D\u6253\u5361\u4E0D\u91CD\u590D\u8BA1\u6570\uFF0C\u65AD\u7B7E\u4ECE 1 \u91CD\u6765\u3002<br>
       <b>\u751F\u5B58</b>\uFF1A15 \u79D2/\u9898\uFF0C\u8D85\u65F6 -3\uFF0C\u7B54\u9519\u6BCF\u5DEE 1 \u4E2A\u96F6\u6263 1 \u8840\uFF0C\u6781\u51C6\u56DE\u8840 +1\u3002<br>
       <b>\u6570\u91CF\u7EA7</b>\uFF1A\u652F\u6301 12\u4EBF\u30011.2e9\u30011,200,000,000 \u4E09\u79CD\u5199\u6CD5\u3002</div>`
      );
    });
    $3("home-achievements").addEventListener("click", () => {
      const rows = ACHIEVEMENTS.map((a) => {
        const got = ach.unlocked[a.id];
        return `<li class="setting-row"><span>${got ? a.icon : "\u{1F512}"} ${a.name}${got ? "" : ' <small style="color:var(--sub)">\uFF08\u672A\u89E3\u9501\uFF09</small>'}</span><span style="font-size:var(--fs-11);color:var(--sub)">${a.desc}</span></li>`;
      }).join("");
      openInfo("\u{1F3C6} \u6210\u5C31", `<ul class="ach-list">${rows}</ul>`);
    });
    $3("back-btn").addEventListener("click", () => {
      if (showScreen("home") === false) return;
      renderHome();
    });
  }
  var GUIDE_STEPS = [
    { el: "v-slider", text: "\u62D6\u52A8\u8FD9\u6761\u6ED1\u5757\uFF0C\u628A\u76EE\u6807\u7269\u8C03\u5230\u4F60\u8BA4\u4E3A\u7684\u771F\u5B9E\u6BD4\u4F8B\u2014\u2014\u523B\u5EA6\u662F\u56FA\u5B9A\u7684\uFF0C\u4E0D\u4F1A\u6CC4\u9898\u3002" },
    { el: "v-fine-group", text: "\u89C9\u5F97\u5DEE\u4E00\u70B9\uFF1F\u6309\u4F4F \xB11% \u5FAE\u8C03\u6162\u6162\u632A\uFF1B\u65B9\u5411\u952E\u4E5F\u884C\uFF08\u6309\u4F4F Shift \u662F 10%\uFF09\u3002" },
    { el: "v-lock", text: "\u8C03\u597D\u4E86\u5C31\u70B9\u300C\u9501\u5B9A\u7B54\u6848\u300D\uFF0C\u770B\u770B\u771F\u5B9E\u6BD4\u4F8B\u548C\u4F60\u7684\u4F30\u6D4B\u5DEE\u591A\u5C11\u3002" }
  ];
  var guideIdx = 0;
  function startGuide() {
    guideIdx = 0;
    $3("guide-layer").classList.remove("hidden");
    renderGuideStep();
    $3("guide-next").focus();
  }
  function renderGuideStep() {
    const step = GUIDE_STEPS[guideIdx];
    const target = step.el === "v-fine-group" ? document.querySelector(".fine-row") : $3(step.el);
    if (!target) return endGuide();
    const r = target.getBoundingClientRect();
    const spot = $3("guide-spot");
    spot.style.width = Math.min(window.innerWidth - 12, r.width + 12) + "px";
    spot.style.height = r.height + 12 + "px";
    spot.style.transform = `translate(${Math.max(6, r.left - 6)}px, ${Math.max(6, r.top - 6)}px)`;
    $3("guide-text").textContent = step.text;
    $3("guide-next").textContent = guideIdx >= GUIDE_STEPS.length - 1 ? "\u5F00\u59CB\uFF01" : "\u4E0B\u4E00\u6B65";
  }
  function endGuide() {
    $3("guide-layer").classList.add("hidden");
    store.setItem("bsz_guide_done", "1");
    if (!$3("screen-visual").classList.contains("hidden")) $3("v-slider").focus();
  }
  function bindGuide() {
    $3("guide-next").addEventListener("click", () => {
      guideIdx += 1;
      if (guideIdx >= GUIDE_STEPS.length) endGuide();
      else renderGuideStep();
    });
    $3("guide-skip").addEventListener("click", endGuide);
    $3("guide-layer").addEventListener("click", (e) => {
      if (!$3("guide-bubble").contains(e.target)) endGuide();
    });
    window.addEventListener("resize", () => {
      if (!$3("guide-layer").classList.contains("hidden")) renderGuideStep();
    });
  }
  var FOCUSABLE_SEL = 'a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  function activeLayer() {
    if (!$3("settings-modal").classList.contains("hidden")) {
      return { el: $3("settings-modal"), close: () => $3("set-close").click() };
    }
    if (!$3("info-modal").classList.contains("hidden")) {
      return {
        el: $3("info-modal"),
        close: () => {
          const ok = $3("info-ok");
          if (ok) ok.click();
        }
      };
    }
    if (!$3("guide-layer").classList.contains("hidden")) {
      return { el: $3("guide-layer"), close: endGuide };
    }
    return null;
  }
  function bindLayerTrap() {
    document.addEventListener("keydown", (e) => {
      const layer = activeLayer();
      if (!layer) return;
      if (e.key === "Escape") {
        e.preventDefault();
        layer.close();
        return;
      }
      if (e.key !== "Tab") return;
      const nodes = Array.from(layer.el.querySelectorAll(FOCUSABLE_SEL)).filter((n) => n.offsetParent !== null);
      if (!nodes.length) return;
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      const active = document.activeElement;
      const inside = nodes.indexOf(active) >= 0;
      if (e.shiftKey) {
        if (!inside || active === first) {
          e.preventDefault();
          last.focus();
        }
      } else if (!inside || active === last) {
        e.preventDefault();
        first.focus();
      }
    });
  }
  async function boot() {
    applySettings();
    bindSettings();
    bindHomeActions();
    bindGuide();
    bindLayerTrap();
    initVisual(ctx4);
    initNumeric(ctx4);
    await loadPack();
    renderHome();
    showScreen("home");
  }
  boot();
})();

</script>
