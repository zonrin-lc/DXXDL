name: Jimp API Migration Verify

on:
  push:
    branches:
      - security/jimp-compat-migration-2026-10
    paths:
      - "size-it-up-mobile/package.json"
      - "size-it-up-mobile/package-lock.json"
      - "size-it-up-mobile/tools/build-assets.mjs"
      - "size-it-up-mobile/test/jimp-asset-compat.test.js"
      - ".github/workflows/jimp-compat-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: security/jimp-compat-migration-2026-10
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: size-it-up-mobile/package-lock.json
      - name: Regenerate npm lockfile
        working-directory: size-it-up-mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit regenerated lockfile before downstream validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add size-it-up-mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
          else
            git commit -m "security: regenerate lockfile for Jimp 0.22 compatibility"
            git push origin HEAD:security/jimp-compat-migration-2026-10
          fi
      - name: Install exact lockfile
        working-directory: size-it-up-mobile
        run: npm ci
      - name: Run tests, source metadata gate, and H5 build
        working-directory: size-it-up-mobile
        run: npm run verify
      - name: Run asset processor if source images are present
        working-directory: size-it-up-mobile
        run: |
          if [ -d assets/raw ] && find assets/raw -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print -quit | grep -q .; then
            node tools/build-assets.mjs
          else
            echo "No assets/raw images found; synthetic Jimp API regression ran through Vitest."
          fi
      - name: Production dependency audit
        working-directory: size-it-up-mobile
        run: npm audit --omit=dev
      - name: Remaining development dependency audit summary
        working-directory: size-it-up-mobile
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const r=require('/tmp/npm-audit.json'); console.log('Advisory summary:', JSON.stringify(r.metadata?.vulnerabilities||{})); for (const [n,v] of Object.entries(r.vulnerabilities||{})) console.log([n,v.severity,v.isDirect?'direct':'transitive',JSON.stringify(v.fixAvailable)].join(' | '));"
