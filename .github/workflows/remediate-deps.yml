name: Dependency Remediation (Vitest 4)

on:
  push:
    branches:
      - security/dependency-remediation-2026-10
    paths:
      - "size-it-up-mobile/package.json"
      - "size-it-up-mobile/package-lock.json"
      - ".github/workflows/remediate-deps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v5
        with:
          ref: security/dependency-remediation-2026-10
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: size-it-up-mobile/package-lock.json
      - name: Regenerate lockfile with npm
        working-directory: size-it-up-mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Clean install
        working-directory: size-it-up-mobile
        run: npm ci
      - name: Run tests, content audit, and build
        working-directory: size-it-up-mobile
        run: npm run verify
      - name: Check production dependency vulnerabilities
        working-directory: size-it-up-mobile
        run: npm audit --omit=dev
      - name: Summarize remaining development advisories
        working-directory: size-it-up-mobile
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const r=require('/tmp/npm-audit.json'); const v=r.metadata?.vulnerabilities||{}; console.log('Remaining advisories:', JSON.stringify(v)); for (const [n,x] of Object.entries(r.vulnerabilities||{})) console.log([n,x.severity,x.isDirect?'direct':'transitive',JSON.stringify(x.fixAvailable)].join(' | '));"
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add size-it-up-mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged; no commit needed."
          else
            git commit -m "security: regenerate lockfile for patched Vitest"
            git push origin HEAD:security/dependency-remediation-2026-10
          fi
