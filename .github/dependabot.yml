version: 2
updates:
  - package-ecosystem: npm
    directory: /size-it-up-mobile
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      npm-patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      npm-security:
        applies-to: security-updates
        update-types:
          - patch
          - minor
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
